<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1f12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vangers" />
    <meta name="description" content="Play Vangers in the browser with your own copy of the game." />
    <title>Vangers</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Caveat+Brush&display=swap"
    />
  </head>
  <body>
    <canvas id="canvas" tabindex="-1" aria-label="Vangers game"></canvas>
    <main class="launcher" data-state="checking">
      <section class="launcher-panel">
        <h1 class="wordmark">Vangers</h1>
        <div class="launcher-body" aria-live="polite"></div>
        <p class="fineprint">
          Vangers by K-D Lab. This page contains no game data: it runs the open-source engine
          (<a href="https://github.com/KranX/Vangers">GPLv3</a>) with files from your own copy.
        </p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
